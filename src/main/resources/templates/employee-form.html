<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Employee | EmployeeMS</title>

    <link rel="stylesheet"
          th:href="@{/css/employee-form.css}">

</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="form-navbar">

    <div class="form-logo">

        <div class="form-logo-icon">
            E
        </div>

        <span>
            Employee<span class="form-blue">MS</span>
        </span>

    </div>


    <div class="form-nav-links">

        <a th:href="@{/}">
            Home
        </a>

        <a th:href="@{/employees}">
            Employees
        </a>

    </div>

</nav>


<!-- ================= FORM SECTION ================= -->

<main class="form-main">

    <div class="form-container">

        <div class="form-header">

            <div class="form-badge">
                EMPLOYEE MANAGEMENT SYSTEM
            </div>

            <h1>
                Add Employee
            </h1>

            <p>
                Add a new employee to your organization.
            </p>

        </div>


        <!-- ================= FORM ================= -->

        <form th:action="@{/save-employee}"
              method="post"
              class="employee-form">


            <!-- Hidden ID -->

            <input type="hidden"
                   name="id"
                   th:value="${employee.id}">


            <!-- Employee Name -->

            <div class="form-group">

                <label for="name">
                    Employee Name
                </label>

                <input
                        type="text"
                        id="name"
                        name="name"
                        th:value="${employee.name}"
                        placeholder="Enter employee name"
                        required>

            </div>


            <!-- Email -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                        type="email"
                        id="email"
                        name="email"
                        th:value="${employee.email}"
                        placeholder="Enter email address"
                        required>

            </div>


            <!-- Department -->

            <div class="form-group">

                <label for="department">
                    Department
                </label>

                <input
                        type="text"
                        id="department"
                        name="department"
                        th:value="${employee.department}"
                        placeholder="Enter department"
                        required>

            </div>


            <!-- Salary -->

            <div class="form-group">

                <label for="salary">
                    Salary
                </label>

                <input
                        type="number"
                        id="salary"
                        name="salary"
                        th:value="${employee.salary}"
                        placeholder="Enter salary"
                        required>

            </div>


            <!-- Buttons -->

            <div class="form-actions">

                <a th:href="@{/employees}"
                   class="cancel-btn">
                    Cancel
                </a>

                <button type="submit"
                        class="save-btn">
                    Save Employee
                </button>

            </div>

        </form>

    </div>

</main>

</body>
</html>
